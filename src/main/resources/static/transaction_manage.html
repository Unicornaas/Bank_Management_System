<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易管理</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --primary: #1e3a5f; --primary-light: #2d5a87;
            --accent: #c9a84c;
            --bg: #f1f5f9; --card: #ffffff;
            --text: #1a202c; --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --radius: 14px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Microsoft YaHei', -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px 28px; }
        .page-header { margin-bottom: 20px; }
        .page-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .page-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
        .stat-card .icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .icon.blue { background: #eff6ff; } .icon.green { background: #ecfdf5; } .icon.red { background: #fef2f2; }
        .stat-card .info .value { font-size: 22px; font-weight: 700; line-height: 1.2; }
        .stat-card .info .label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8fafc; }
        th { padding: 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-in { background: #ecfdf5; color: #059669; }
        .badge-out { background: #fef2f2; color: #dc2626; }
        .badge-transfer { background: #eff6ff; color: #2563eb; }
        .pagination-wrap { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 18px 0; }
        .pagination-wrap button { min-width: 36px; height: 36px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); }
        .pagination-wrap button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pagination-wrap button:disabled { opacity: 0.35; cursor: not-allowed; }
        .pagination-wrap .page-info { font-size: 13px; color: var(--text-secondary); margin-left: 12px; }

        .search-bar { background: var(--card); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; box-shadow: var(--shadow); }
        .search-bar .field { display: flex; flex-direction: column; gap: 4px; }
        .search-bar label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .search-bar input, .search-bar select { height: 38px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-size: 13px; background: #f8fafc; outline: none; width: 140px; }
        .search-bar input:focus { border-color: var(--primary-light); background: #fff; }
        .btn-search { background: var(--primary); color: #fff; border: none; height: 38px; padding: 0 22px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-reset { background: #fff; color: var(--text-secondary); border: 1.5px solid var(--border); height: 38px; padding: 0 18px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="page-header">
        <h2>📋 交易流水</h2>
        <p>所有客户的交易记录一览</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="icon blue">📋</div><div class="info"><div class="value" id="statTotal">--</div><div class="label">总交易笔数</div></div></div>
        <div class="stat-card"><div class="icon green">💰</div><div class="info"><div class="value" id="statIn">--</div><div class="label">存款类交易</div></div></div>
        <div class="stat-card"><div class="icon red">💸</div><div class="info"><div class="value" id="statOut">--</div><div class="label">取款类交易</div></div></div>
    </div>

    <div class="search-bar">
        <div class="field"><label>用户ID</label><input type="number" id="sUid" placeholder="用户编号"></div>
        <div class="field"><label>交易类型</label><input type="text" id="sType" placeholder="如：存款、取款"></div>
        <button class="btn-search" onclick="doSearch()">🔍 搜索</button>
        <button class="btn-reset" onclick="resetSearch()">↻ 全部</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr><th>编号</th><th>用户ID</th><th>交易类型</th><th>金额 (元)</th><th>时间</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="pagination-wrap" id="pagination"></div>
    </div>

    <script>
        let allData = [], currentPage = 1, pageSize = 15;

        async function loadData() {
            try {
                const resp = await fetch('/api/bills/all');
                const r = await resp.json();
                allData = r.data || [];
                // 统计
                document.getElementById('statTotal').textContent = allData.length;
                const inCount = allData.filter(b => b.type && (b.type.includes('存入')||b.type.includes('转入')||b.type==='存款')).length;
                document.getElementById('statIn').textContent = inCount;
                document.getElementById('statOut').textContent = allData.length - inCount;
                renderPage(1);
            } catch(e) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">加载失败</td></tr>'; }
        }

        function renderPage(page) {
            currentPage = page;
            const totalPages = Math.ceil(allData.length / pageSize);
            const start = (page - 1) * pageSize;
            const data = allData.slice(start, start + pageSize);
            const tbody = document.getElementById('tableBody');
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:48px;">暂无数据</td></tr>'; } else {
                tbody.innerHTML = data.map(b => {
                    const isIn = b.type && (b.type.includes('存入')||b.type.includes('转入')||b.type==='存款');
                    const isTransfer = b.type && b.type.includes('转账');
                    let tag = '<span class="badge badge-out">' + (b.type||'-') + '</span>';
                    if (isTransfer) tag = '<span class="badge badge-transfer">' + (b.type||'-') + '</span>';
                    else if (isIn) tag = '<span class="badge badge-in">' + (b.type||'-') + '</span>';
                    const time = b.createTime ? new Date(b.createTime).toLocaleString('zh-CN') : '-';
                    return `<tr><td>${b.id}</td><td>${b.uid}</td><td>${tag}</td><td>￥${(b.amount||0).toFixed(2)}</td><td>${time}</td></tr>`;
                }).join('');
            }
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pg = document.getElementById('pagination');
            if (totalPages <= 1) { pg.innerHTML = ''; return; }
            let html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="renderPage(' + (currentPage - 1) + ')">◀</button>';
            const s = Math.max(1, currentPage - 2), e = Math.min(totalPages, currentPage + 2);
            if (s > 1) { html += '<button onclick="renderPage(1)">1</button>'; if (s > 2) html += '<span>…</span>'; }
            for (let i = s; i <= e; i++) html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="renderPage(' + i + ')">' + i + '</button>';
            if (e < totalPages) { if (e < totalPages - 1) html += '<span>…</span>'; html += '<button onclick="renderPage(' + totalPages + ')">' + totalPages + '</button>'; }
            html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="renderPage(' + (currentPage + 1) + ')">▶</button>';
            html += '<span class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页，共 ' + allData.length + ' 条</span>';
            pg.innerHTML = html;
        }

        function doSearch() {
            const uid = document.getElementById('sUid').value.trim();
            const type = document.getElementById('sType').value.trim();
            let filtered = allData;
            if (uid) filtered = filtered.filter(b => b.uid == uid);
            if (type) filtered = filtered.filter(b => b.type && b.type.includes(type));
            allData = filtered;
            renderPage(1);
        }

        function resetSearch() {
            document.getElementById('sUid').value = '';
            document.getElementById('sType').value = '';
            loadData();
        }

        loadData();
    </script>
</body>
</html>
