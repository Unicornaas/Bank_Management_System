<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --primary: #1e3a5f; --primary-light: #2d5a87;
            --accent: #c9a84c;
            --bg: #f1f5f9; --card: #ffffff;
            --text: #1a202c; --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #10b981; --danger: #ef4444;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
            --radius: 14px; --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Microsoft YaHei', -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            padding: 24px 28px;
        }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .page-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff; border: none; padding: 10px 22px; border-radius: 8px;
            font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition);
            box-shadow: 0 2px 8px rgba(30,58,95,0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(30,58,95,0.3); }

        .search-bar {
            background: var(--card); border-radius: var(--radius); padding: 16px 20px;
            margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-end;
            flex-wrap: wrap; box-shadow: var(--shadow);
        }
        .search-bar .field { display: flex; flex-direction: column; gap: 4px; }
        .search-bar label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .search-bar input, .search-bar select {
            height: 38px; border: 1.5px solid var(--border); border-radius: 8px;
            padding: 0 12px; font-size: 13px; background: #f8fafc; outline: none;
            transition: var(--transition); width: 130px;
        }
        .search-bar input:focus, .search-bar select:focus { border-color: var(--primary-light); background: #fff; }
        .btn-search { background: var(--primary); color: #fff; border: none; height: 38px; padding: 0 22px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-reset { background: #fff; color: var(--text-secondary); border: 1.5px solid var(--border); height: 38px; padding: 0 18px; border-radius: 8px; cursor: pointer; }

        .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8fafc; }
        th { padding: 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 13px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background: #f8fafc; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-male { background: #eff6ff; color: #2563eb; }
        .badge-female { background: #fdf2f8; color: #db2777; }
        .badge-other { background: #f1f5f9; color: #64748b; }
        .money-positive { color: #059669; font-weight: 600; }

        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-sm { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; transition: var(--transition); }
        .btn-sm.edit { background: #eff6ff; color: #2563eb; }
        .btn-sm.deposit { background: #ecfdf5; color: #059669; }
        .btn-sm.withdraw { background: #fef2f2; color: #dc2626; }
        .btn-sm.bill { background: #f0fdf4; color: #16a34a; }
        .btn-sm.delete { background: #fff; color: #dc2626; border: 1px solid #fecaca; }
        .btn-sm.delete:hover { background: #dc2626; color: #fff; }

        .pagination-wrap { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 18px 0; }
        .pagination-wrap button {
            min-width: 36px; height: 36px; border: 1.5px solid var(--border); border-radius: 8px;
            background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text);
        }
        .pagination-wrap button.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
        .pagination-wrap button:disabled { opacity: 0.35; cursor: not-allowed; }
        .pagination-wrap .page-info { font-size: 13px; color: var(--text-secondary); margin-left: 12px; font-weight: 500; }

        /* 弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,29,54,0.6); backdrop-filter: blur(4px); z-index: 999; justify-content: center; align-items: flex-start; padding-top: 50px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--card); width: 540px; max-width: 94vw; max-height: 85vh; border-radius: var(--radius); box-shadow: 0 25px 60px rgba(0,0,0,0.3); overflow: hidden; display: flex; flex-direction: column; animation: modalIn 0.25s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(-20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-size: 17px; font-weight: 700; }
        .modal-close { width: 34px; height: 34px; border: none; background: #f1f5f9; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text-secondary); }
        .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
        .modal-body .row { display: flex; gap: 14px; margin-bottom: 14px; }
        .modal-body .fg { flex: 1; }
        .modal-body label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 4px; }
        .modal-body input, .modal-body select { width: 100%; height: 40px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-size: 14px; outline: none; }
        .modal-body input:focus { border-color: var(--primary-light); }
        .gender-opt { display: flex; gap: 18px; padding-top: 8px; }
        .gender-opt label { font-weight: 400; cursor: pointer; }
        .modal-footer { padding: 14px 24px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
        .btn-cancel { background: #f1f5f9; border: 1px solid var(--border); color: #475569; padding: 9px 24px; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-submit { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border: none; color: #fff; padding: 9px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-submit.danger { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .field-msg { font-size: 13px; margin-top: 6px; display: none; }
        .field-msg.show { display: block; }
        .field-msg.success { color: #059669; }
        .field-msg.error { color: #dc2626; }
        .bill-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .bill-table th { background: #f8fafc; padding: 10px 14px; border-bottom: 2px solid var(--border); }
        .bill-table td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>
    <div class="page-header">
        <h2>👥 客户列表 <span style="font-size:13px;color:var(--text-secondary);font-weight:400;" id="totalCount"></span></h2>
        <button class="btn-primary" onclick="openAddModal()">＋ 开户登记</button>
    </div>

    <div class="search-bar">
        <div class="field"><label>账号</label><input type="text" id="sUsername" placeholder="模糊搜索"></div>
        <div class="field"><label>姓名</label><input type="text" id="sName" placeholder="模糊搜索"></div>
        <div class="field"><label>性别</label><select id="sGender"><option value="">全部</option><option value="男">男</option><option value="女">女</option></select></div>
        <div class="field"><label>年龄≥</label><input type="number" id="sAge" placeholder="0"></div>
        <div class="field"><label>余额≥</label><input type="number" id="sMoney" placeholder="0"></div>
        <button class="btn-search" onclick="doSearch()">🔍 搜索</button>
        <button class="btn-reset" onclick="resetSearch()">↻ 重置</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr><th>编号</th><th>账号</th><th>姓名</th><th>年龄</th><th>性别</th><th>身份证</th><th>手机号</th><th>角色</th><th>余额 (元)</th><th>操作</th></tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
        <div class="pagination-wrap" id="pagination"></div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header"><h3 id="modalTitle">📝 客户信息</h3><button class="modal-close" onclick="closeEditModal()">✕</button></div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="row">
                    <div class="fg"><label>账号 *</label><input type="text" id="editUsername"></div>
                    <div class="fg"><label>密码 <small>(留空不修改)</small></label><input type="password" id="editPassword"></div>
                </div>
                <div class="row">
                    <div class="fg"><label>姓名 *</label><input type="text" id="editName"></div>
                    <div class="fg"><label>年龄</label><input type="number" id="editAge"></div>
                </div>
                <div class="row">
                    <div class="fg"><label>身份证</label><input type="text" id="editCard"></div>
                    <div class="fg"><label>手机号</label><input type="text" id="editPhone"></div>
                </div>
                <div class="row">
                    <div class="fg"><label>余额 (元)</label><input type="number" id="editMoney"></div>
                    <div class="fg">
                        <label>性别</label>
                        <div class="gender-opt">
                            <label><input type="radio" name="editGender" value="男" checked> 男</label>
                            <label><input type="radio" name="editGender" value="女"> 女</label>
                            <label><input type="radio" name="editGender" value="保密"> 保密</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-submit" id="btnSubmit" onclick="submitForm()">确认</button>
            </div>
        </div>
    </div>

    <!-- 存取款弹窗 -->
    <div class="modal-overlay" id="depWdModal">
        <div class="modal-box" style="width:420px;">
            <div class="modal-header"><h3 id="depWdTitle">💰 操作</h3><button class="modal-close" onclick="closeDepWdModal()">✕</button></div>
            <div class="modal-body">
                <p style="margin-bottom:12px;color:var(--text-secondary);font-size:14px;" id="depWdInfo"></p>
                <div class="fg"><label>金额 (元)</label><input type="number" id="depWdAmount" placeholder="请输入金额" min="0.01" step="0.01"></div>
                <div class="field-msg" id="msg-depWd"></div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeDepWdModal()">取消</button>
                <button class="btn-submit" id="depWdSubmit" onclick="doDepWd()">确认</button>
            </div>
        </div>
    </div>

    <!-- 流水弹窗 -->
    <div class="modal-overlay" id="billModal">
        <div class="modal-box" style="width:680px;">
            <div class="modal-header"><h3>📋 流水账单 · <span id="billUserName" style="color:var(--primary);">--</span></h3><button class="modal-close" onclick="closeBillModal()">✕</button></div>
            <div class="modal-body">
                <table class="bill-table">
                    <thead><tr><th>编号</th><th>类型</th><th>金额 (元)</th><th>时间</th></tr></thead>
                    <tbody id="billTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let editMode = 'add';
        let currentPage = 1, pageSize = 10, totalPages = 1;
        let _depWdUid, _depWdType;

        function logout() { parent.window.location.href = '/login.html'; }

        async function loadUsers(page = 1) {
            currentPage = page;
            try {
                const resp = await fetch('/api/users/page?page=' + page + '&size=' + pageSize);
                const r = await resp.json();
                if (r.success) {
                    renderData(r.data || []);
                    totalPages = r.totalPages;
                    document.getElementById('totalCount').textContent = '· 共 ' + r.total + ' 人';
                    renderPagination();
                }
            } catch(e) {
                document.getElementById('userTableBody').innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text-secondary);">加载失败</td></tr>';
            }
        }

        function renderPagination() {
            const pg = document.getElementById('pagination');
            if (totalPages <= 1) { pg.innerHTML = ''; return; }
            let html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="loadUsers(' + (currentPage - 1) + ')">◀</button>';
            const start = Math.max(1, currentPage - 2);
            const end = Math.min(totalPages, currentPage + 2);
            if (start > 1) { html += '<button onclick="loadUsers(1)">1</button>'; if (start > 2) html += '<span style="color:var(--text-secondary);">…</span>'; }
            for (let i = start; i <= end; i++) {
                html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="loadUsers(' + i + ')">' + i + '</button>';
            }
            if (end < totalPages) { if (end < totalPages - 1) html += '<span>…</span>'; html += '<button onclick="loadUsers(' + totalPages + ')">' + totalPages + '</button>'; }
            html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="loadUsers(' + (currentPage + 1) + ')">▶</button>';
            html += '<span class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
            pg.innerHTML = html;
        }

        function renderData(data) {
            const tbody = document.getElementById('userTableBody');
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:48px;color:var(--text-secondary);">暂无数据</td></tr>'; return; }
            tbody.innerHTML = data.map(u => {
                let gb = '<span class="badge badge-other">' + (u.gender || '保密') + '</span>';
                if (u.gender === '男') gb = '<span class="badge badge-male">男</span>';
                else if (u.gender === '女') gb = '<span class="badge badge-female">女</span>';
                return `<tr>
                    <td>${u.id}</td><td>${u.username || '-'}</td><td><strong>${u.name || '-'}</strong></td>
                    <td>${u.age || '-'}</td><td>${gb}</td><td style="font-size:12px;">${u.card || '-'}</td><td>${u.phone || '-'}</td>
                    <td><span class="badge badge-${(u.role==='manager'?'male':'other')}">${u.role==='manager'?'经理':'储户'}</span></td>
                    <td class="money-positive">￥${(u.money || 0).toLocaleString('zh-CN', {minimumFractionDigits:2})}</td>
                    <td><div class="action-btns">
                        ${buildActionBtn('edit', u)}${buildActionBtn('deposit', u)}${buildActionBtn('withdraw', u)}${buildActionBtn('bill', u)}${buildActionBtn('delete', u)}
                    </div></td>
                </tr>`;
            }).join('');
        }

        function buildActionBtn(type, u) {
            const map = {
                edit: `<button class="btn-sm edit" onclick="openEditModal(${u.id})">✎ 编辑</button>`,
                deposit: `<button class="btn-sm deposit" onclick="openDepWdModal(${u.id},'${u.name||u.username}',${u.money||0},'deposit')">💰 存款</button>`,
                withdraw: `<button class="btn-sm withdraw" onclick="openDepWdModal(${u.id},'${u.name||u.username}',${u.money||0},'withdraw')">💸 取款</button>`,
                bill: `<button class="btn-sm bill" onclick="openBillModal(${u.id},'${u.name||u.username}')">📋 流水</button>`,
                delete: `<button class="btn-sm delete" onclick="deleteUser(${u.id},'${u.name||u.username}')">🗑</button>`
            };
            return map[type] || '';
        }

        // 搜索
        async function doSearch() {
            const params = new URLSearchParams();
            const name = document.getElementById('sName').value.trim();
            const gender = document.getElementById('sGender').value;
            const age = document.getElementById('sAge').value;
            const money = document.getElementById('sMoney').value;
            const username = document.getElementById('sUsername').value.trim();
            if (name) params.append('name', name);
            if (gender) params.append('gender', gender);
            if (age) params.append('age', age);
            if (money) params.append('money', money);
            if (username) params.append('username', username);
            try {
                const resp = await fetch('/api/users/search', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                document.getElementById('totalCount').textContent = '· 搜索结果：' + (r.data || []).length + ' 人';
                renderData(r.data || []);
                document.getElementById('pagination').innerHTML = '<span class="page-info" style="cursor:pointer;color:var(--primary-light);" onclick="resetSearch()">↻ 返回分页列表</span>';
            } catch(e) { alert('搜索失败'); }
        }

        function resetSearch() {
            ['sUsername','sName','sGender','sAge','sMoney'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('sGender').value = '';
            loadUsers(1);
        }

        // 存取款
        function openDepWdModal(uid, name, balance, type) {
            _depWdUid = uid; _depWdType = type;
            document.getElementById('depWdTitle').textContent = type === 'deposit' ? '💰 存款' : '💸 取款';
            document.getElementById('depWdInfo').innerHTML = '用户：<strong>' + name + '</strong> (ID:' + uid + ') | 余额：<strong>￥' + (balance||0).toFixed(2) + '</strong>';
            document.getElementById('depWdAmount').value = '';
            document.getElementById('msg-depWd').className = 'field-msg';
            document.getElementById('depWdSubmit').textContent = type === 'deposit' ? '确认存款' : '确认取款';
            document.getElementById('depWdSubmit').className = 'btn-submit' + (type === 'withdraw' ? ' danger' : '');
            document.getElementById('depWdModal').classList.add('active');
        }
        function closeDepWdModal() { document.getElementById('depWdModal').classList.remove('active'); }
        async function doDepWd() {
            const amount = parseFloat(document.getElementById('depWdAmount').value);
            const msgEl = document.getElementById('msg-depWd');
            if (!amount || amount <= 0) { msgEl.textContent = '请输入有效金额'; msgEl.className = 'field-msg show error'; return; }
            const url = _depWdType === 'deposit' ? '/api/deposit' : '/api/withdraw';
            const params = new URLSearchParams();
            params.append('userId', _depWdUid); params.append('amount', amount);
            try {
                const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                msgEl.textContent = r.message;
                msgEl.className = 'field-msg show ' + (r.success ? 'success' : 'error');
                if (r.success) { setTimeout(() => { closeDepWdModal(); loadUsers(currentPage); }, 800); }
            } catch(e) { msgEl.textContent = '网络错误'; msgEl.className = 'field-msg show error'; }
        }

        // 删除
        async function deleteUser(id, name) {
            if (!confirm('确定删除「' + name + '」(ID:' + id + ')？')) return;
            await fetch('/api/users/' + id, { method: 'DELETE' });
            loadUsers(currentPage);
        }

        // 编辑弹窗
        function openAddModal() {
            editMode = 'add';
            document.getElementById('modalTitle').textContent = '📝 新客户开户登记';
            document.getElementById('btnSubmit').textContent = '确认开户';
            ['editId','editUsername','editPassword','editName','editCard','editPhone'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('editUsername').disabled = false;
            document.getElementById('editAge').value = '18';
            document.getElementById('editMoney').value = '0';
            document.querySelector('input[name="editGender"][value="男"]').checked = true;
            document.getElementById('editModal').classList.add('active');
        }
        async function openEditModal(id) {
            try {
                const resp = await fetch('/api/users/' + id);
                const user = await resp.json();
                if (!user || !user.id) { alert('用户不存在'); return; }
                editMode = 'edit';
                document.getElementById('modalTitle').textContent = '✎ 修改客户信息';
                document.getElementById('btnSubmit').textContent = '保存修改';
                document.getElementById('editId').value = user.id;
                document.getElementById('editUsername').value = user.username || '';
                document.getElementById('editUsername').disabled = true;
                document.getElementById('editPassword').value = '';
                document.getElementById('editName').value = user.name || '';
                document.getElementById('editAge').value = user.age || '';
                document.getElementById('editCard').value = user.card || '';
                document.getElementById('editPhone').value = user.phone || '';
                document.getElementById('editMoney').value = user.money || 0;
                const gender = user.gender || '保密';
                const radio = document.querySelector('input[name="editGender"][value="' + gender + '"]');
                if (radio) radio.checked = true;
                document.getElementById('editModal').classList.add('active');
            } catch(e) { alert('获取用户信息失败'); }
        }
        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }
        async function submitForm() {
            const id = document.getElementById('editId').value;
            const username = document.getElementById('editUsername').value.trim();
            const password = document.getElementById('editPassword').value.trim();
            const name = document.getElementById('editName').value.trim();
            const age = document.getElementById('editAge').value;
            const card = document.getElementById('editCard').value.trim();
            const phone = document.getElementById('editPhone').value.trim();
            const money = document.getElementById('editMoney').value;
            const gender = document.querySelector('input[name="editGender"]:checked')?.value || '保密';
            if (!name) { alert('请输入姓名'); return; }
            if (editMode === 'add' && (!username || !password)) { alert('请输入账号和密码'); return; }
            const params = new URLSearchParams();
            if (editMode === 'edit') {
                params.append('id', id);
                if (password) params.append('password', password);
                if (name) params.append('name', name);
                if (age) params.append('age', age);
                if (card) params.append('card', card);
                if (phone) params.append('phone', phone);
                if (money !== '') params.append('money', money);
                params.append('gender', gender);
                const resp = await fetch('/api/users', { method: 'PUT', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                alert(r.message);
                if (r.success) { closeEditModal(); loadUsers(currentPage); }
            } else {
                params.append('username', username); params.append('password', password);
                params.append('name', name); params.append('age', age || '0');
                params.append('gender', gender); params.append('card', card);
                params.append('phone', phone); params.append('money', money || '0');
                const resp = await fetch('/api/users', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                alert(r.message);
                if (r.success) { closeEditModal(); loadUsers(1); }
            }
        }

        // 流水
        async function openBillModal(uid, name) {
            document.getElementById('billUserName').textContent = name + ' (ID:' + uid + ')';
            document.getElementById('billTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;">加载中…</td></tr>';
            document.getElementById('billModal').classList.add('active');
            try {
                const resp = await fetch('/api/bills/' + uid);
                const r = await resp.json();
                const data = r.data || [];
                document.getElementById('billTableBody').innerHTML = data.length === 0
                    ? '<tr><td colspan="4" style="text-align:center;padding:24px;">暂无流水</td></tr>'
                    : data.map(b => `<tr><td>${b.id}</td><td>${b.type||'-'}</td><td>￥${(b.amount||0).toFixed(2)}</td><td>${b.createTime ? new Date(b.createTime).toLocaleString('zh-CN') : '-'}</td></tr>`).join('');
            } catch(e) { document.getElementById('billTableBody').innerHTML = '<tr><td colspan="4">加载失败</td></tr>'; }
        }
        function closeBillModal() { document.getElementById('billModal').classList.remove('active'); }

        ['editModal','billModal','depWdModal'].forEach(id => {
            document.getElementById(id).addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
        });

        loadUsers(1);
    </script>
</body>
</html>
