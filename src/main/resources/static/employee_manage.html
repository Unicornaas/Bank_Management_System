<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --primary: #1e3a5f; --primary-light: #2d5a87;
            --accent: #c9a84c;
            --bg: #f1f5f9; --card: #ffffff;
            --text: #1a202c; --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --radius: 14px; --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Microsoft YaHei', -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px 28px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); box-shadow: 0 2px 8px rgba(30,58,95,0.25); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(30,58,95,0.3); }
        .search-bar { background: var(--card); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; box-shadow: var(--shadow); }
        .search-bar .field { display: flex; flex-direction: column; gap: 4px; }
        .search-bar label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .search-bar input, .search-bar select { height: 38px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-size: 13px; background: #f8fafc; outline: none; width: 130px; }
        .search-bar input:focus, .search-bar select:focus { border-color: var(--primary-light); background: #fff; }
        .btn-search { background: var(--primary); color: #fff; border: none; height: 38px; padding: 0 22px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-reset { background: #fff; color: var(--text-secondary); border: 1.5px solid var(--border); height: 38px; padding: 0 18px; border-radius: 8px; cursor: pointer; }
        .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8fafc; }
        th { padding: 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); white-space: nowrap; }
        td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background: #f8fafc; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-active { background: #ecfdf5; color: #059669; }
        .badge-inactive { background: #fef2f2; color: #dc2626; }
        .badge-male { background: #eff6ff; color: #2563eb; }
        .badge-female { background: #fdf2f8; color: #db2777; }
        .action-btns { display: flex; gap: 6px; }
        .btn-sm { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; transition: var(--transition); }
        .btn-sm.edit { background: #eff6ff; color: #2563eb; }
        .btn-sm.delete { background: #fff; color: #dc2626; border: 1px solid #fecaca; }
        .btn-sm.delete:hover { background: #dc2626; color: #fff; }
        .pagination-wrap { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 18px 0; }
        .pagination-wrap button { min-width: 36px; height: 36px; border: 1.5px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); }
        .pagination-wrap button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pagination-wrap button:disabled { opacity: 0.35; cursor: not-allowed; }
        .pagination-wrap .page-info { font-size: 13px; color: var(--text-secondary); margin-left: 12px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,29,54,0.6); backdrop-filter: blur(4px); z-index: 999; justify-content: center; align-items: flex-start; padding-top: 50px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--card); width: 560px; max-width: 94vw; max-height: 85vh; border-radius: var(--radius); box-shadow: 0 25px 60px rgba(0,0,0,0.3); overflow: hidden; animation: modalIn 0.25s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(-20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-size: 17px; font-weight: 700; }
        .modal-close { width: 34px; height: 34px; border: none; background: #f1f5f9; border-radius: 50%; cursor: pointer; font-size: 18px; color: var(--text-secondary); }
        .modal-body { padding: 20px 24px; overflow-y: auto; max-height: 55vh; }
        .modal-body .row { display: flex; gap: 14px; margin-bottom: 14px; }
        .modal-body .fg { flex: 1; }
        .modal-body label { display: block; font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 4px; }
        .modal-body input, .modal-body select { width: 100%; height: 40px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-size: 14px; outline: none; }
        .modal-body input:focus { border-color: var(--primary-light); }
        .gender-opt { display: flex; gap: 18px; padding-top: 8px; }
        .gender-opt label { font-weight: 400; cursor: pointer; }
        .modal-footer { padding: 14px 24px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
        .btn-cancel { background: #f1f5f9; border: 1px solid var(--border); color: #475569; padding: 9px 24px; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .btn-submit { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border: none; color: #fff; padding: 9px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <div class="page-header">
        <h2>👤 员工列表 <span style="font-size:13px;color:var(--text-secondary);font-weight:400;" id="totalCount"></span></h2>
        <button class="btn-primary" onclick="openAddModal()">＋ 添加员工</button>
    </div>

    <div class="search-bar">
        <div class="field"><label>姓名</label><input type="text" id="sName" placeholder="模糊搜索"></div>
        <div class="field"><label>性别</label><select id="sGender"><option value="">全部</option><option value="男">男</option><option value="女">女</option></select></div>
        <div class="field"><label>职位</label><input type="text" id="sPosition" placeholder="模糊搜索"></div>
        <div class="field"><label>状态</label><select id="sStatus"><option value="">全部</option><option value="在职">在职</option><option value="离职">离职</option></select></div>
        <button class="btn-search" onclick="doSearch()">🔍 搜索</button>
        <button class="btn-reset" onclick="resetSearch()">↻ 重置</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr><th>编号</th><th>姓名</th><th>性别</th><th>年龄</th><th>手机号</th><th>邮箱</th><th>职位</th><th>薪资</th><th>所属网点</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="pagination-wrap" id="pagination"></div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header"><h3 id="modalTitle">📝 员工信息</h3><button class="modal-close" onclick="closeEditModal()">✕</button></div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="row">
                    <div class="fg"><label>用户名 *</label><input type="text" id="editUsername"></div>
                    <div class="fg"><label>密码 <small>(留空不修改)</small></label><input type="password" id="editPassword"></div>
                </div>
                <div class="row">
                    <div class="fg"><label>姓名 *</label><input type="text" id="editName"></div>
                    <div class="fg"><label>年龄</label><input type="number" id="editAge"></div>
                </div>
                <div class="row">
                    <div class="fg"><label>手机号</label><input type="text" id="editPhone"></div>
                    <div class="fg"><label>邮箱</label><input type="text" id="editEmail"></div>
                </div>
                <div class="row">
                    <div class="fg"><label>职位</label><input type="text" id="editPosition"></div>
                    <div class="fg"><label>薪资 (元)</label><input type="number" id="editSalary" step="0.01"></div>
                </div>
                <div class="row">
                    <div class="fg"><label>所属网点</label><select id="editBranchId"></select></div>
                    <div class="fg"><label>状态</label><select id="editStatus"><option value="在职">在职</option><option value="离职">离职</option></select></div>
                </div>
                <div class="row">
                    <div class="fg">
                        <label>性别</label>
                        <div class="gender-opt">
                            <label><input type="radio" name="editGender" value="男" checked> 男</label>
                            <label><input type="radio" name="editGender" value="女"> 女</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn-submit" id="btnSubmit" onclick="submitForm()">确认</button>
            </div>
        </div>
    </div>

    <script>
        let editMode = 'add', currentPage = 1, pageSize = 10, totalPages = 1, branchList = [];

        async function loadBranches() {
            try {
                const resp = await fetch('/api/branches');
                const r = await resp.json();
                branchList = r.data || [];
                const sel = document.getElementById('editBranchId');
                sel.innerHTML = '<option value="">请选择网点</option>' + branchList.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            } catch(e) {}
        }
        loadBranches();

        async function loadData(page = 1) {
            currentPage = page;
            try {
                const resp = await fetch('/api/employees/page?page=' + page + '&size=' + pageSize);
                const r = await resp.json();
                if (r.success) {
                    renderData(r.data || []);
                    totalPages = r.totalPages;
                    document.getElementById('totalCount').textContent = '· 共 ' + r.total + ' 人';
                    renderPagination();
                }
            } catch(e) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="11" style="text-align:center;padding:40px;">加载失败</td></tr>'; }
        }

        function renderPagination() {
            const pg = document.getElementById('pagination');
            if (totalPages <= 1) { pg.innerHTML = ''; return; }
            let html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="loadData(' + (currentPage - 1) + ')">◀</button>';
            const s = Math.max(1, currentPage - 2), e = Math.min(totalPages, currentPage + 2);
            if (s > 1) { html += '<button onclick="loadData(1)">1</button>'; if (s > 2) html += '<span>…</span>'; }
            for (let i = s; i <= e; i++) html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="loadData(' + i + ')">' + i + '</button>';
            if (e < totalPages) { if (e < totalPages - 1) html += '<span>…</span>'; html += '<button onclick="loadData(' + totalPages + ')">' + totalPages + '</button>'; }
            html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="loadData(' + (currentPage + 1) + ')">▶</button>';
            html += '<span class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
            pg.innerHTML = html;
        }

        function renderData(data) {
            const tbody = document.getElementById('tableBody');
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:48px;">暂无数据</td></tr>'; return; }
            tbody.innerHTML = data.map(e => {
                const gb = e.gender === '女' ? '<span class="badge badge-female">女</span>' : '<span class="badge badge-male">' + (e.gender||'男') + '</span>';
                const sb = e.status === '在职' ? '<span class="badge badge-active">在职</span>' : '<span class="badge badge-inactive">' + (e.status||'-') + '</span>';
                return `<tr>
                    <td>${e.id}</td><td><strong>${e.name||'-'}</strong></td><td>${gb}</td><td>${e.age||'-'}</td>
                    <td>${e.phone||'-'}</td><td>${e.email||'-'}</td><td>${e.position||'-'}</td>
                    <td>￥${(e.salary||0).toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
                    <td>${e.branchName||'-'}</td><td>${sb}</td>
                    <td><div class="action-btns">
                        <button class="btn-sm edit" onclick="openEditModal(${e.id})">✎ 编辑</button>
                        <button class="btn-sm delete" onclick="deleteItem(${e.id},'${e.name}')">🗑</button>
                    </div></td>
                </tr>`;
            }).join('');
        }

        async function doSearch() {
            const params = new URLSearchParams();
            const name = document.getElementById('sName').value.trim();
            const gender = document.getElementById('sGender').value;
            const position = document.getElementById('sPosition').value.trim();
            const status = document.getElementById('sStatus').value;
            if (name) params.append('name', name);
            if (gender) params.append('gender', gender);
            if (position) params.append('position', position);
            if (status) params.append('status', status);
            try {
                const resp = await fetch('/api/employees/search', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                document.getElementById('totalCount').textContent = '· 搜索结果：' + (r.data||[]).length + ' 人';
                renderData(r.data || []);
                document.getElementById('pagination').innerHTML = '<span class="page-info" style="cursor:pointer;color:var(--primary-light);" onclick="resetSearch()">↻ 返回分页列表</span>';
            } catch(e) { alert('搜索失败'); }
        }

        function resetSearch() {
            ['sName','sGender','sPosition','sStatus'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('sGender').value = ''; document.getElementById('sStatus').value = '';
            loadData(1);
        }

        function openAddModal() {
            editMode = 'add';
            document.getElementById('modalTitle').textContent = '📝 添加员工';
            document.getElementById('btnSubmit').textContent = '确认添加';
            ['editId','editUsername','editPassword','editName','editPhone','editEmail','editPosition','editSalary'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('editUsername').disabled = false;
            document.getElementById('editAge').value = '25';
            document.getElementById('editStatus').value = '在职';
            document.getElementById('editBranchId').value = '';
            document.querySelector('input[name="editGender"][value="男"]').checked = true;
            document.getElementById('editModal').classList.add('active');
        }

        async function openEditModal(id) {
            try {
                const resp = await fetch('/api/employees/' + id);
                const e = await resp.json();
                if (!e || !e.id) { alert('员工不存在'); return; }
                editMode = 'edit';
                document.getElementById('modalTitle').textContent = '✎ 编辑员工信息';
                document.getElementById('btnSubmit').textContent = '保存修改';
                document.getElementById('editId').value = e.id;
                document.getElementById('editUsername').value = e.username || '';
                document.getElementById('editUsername').disabled = true;
                document.getElementById('editPassword').value = '';
                document.getElementById('editName').value = e.name || '';
                document.getElementById('editAge').value = e.age || '';
                document.getElementById('editPhone').value = e.phone || '';
                document.getElementById('editEmail').value = e.email || '';
                document.getElementById('editPosition').value = e.position || '';
                document.getElementById('editSalary').value = e.salary || '';
                document.getElementById('editStatus').value = e.status || '在职';
                document.getElementById('editBranchId').value = e.branchId || '';
                const radio = document.querySelector('input[name="editGender"][value="' + (e.gender||'男') + '"]');
                if (radio) radio.checked = true;
                document.getElementById('editModal').classList.add('active');
            } catch(ex) { alert('获取员工信息失败'); }
        }

        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }

        async function submitForm() {
            const id = document.getElementById('editId').value;
            const username = document.getElementById('editUsername').value.trim();
            const password = document.getElementById('editPassword').value.trim();
            const name = document.getElementById('editName').value.trim();
            const age = document.getElementById('editAge').value;
            const phone = document.getElementById('editPhone').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const position = document.getElementById('editPosition').value.trim();
            const salary = document.getElementById('editSalary').value;
            const branchId = document.getElementById('editBranchId').value;
            const status = document.getElementById('editStatus').value;
            const gender = document.querySelector('input[name="editGender"]:checked')?.value || '男';
            if (!name) { alert('请输入姓名'); return; }
            if (editMode === 'add' && (!username || !password)) { alert('请输入用户名和密码'); return; }
            const params = new URLSearchParams();
            if (editMode === 'edit') {
                params.append('id', id);
                if (password) params.append('password', password);
                if (name) params.append('name', name);
                if (age) params.append('age', age);
                if (phone) params.append('phone', phone);
                if (email) params.append('email', email);
                if (position) params.append('position', position);
                if (salary) params.append('salary', salary);
                if (branchId) params.append('branchId', branchId);
                if (status) params.append('status', status);
                params.append('gender', gender);
                const resp = await fetch('/api/employees', { method: 'PUT', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                alert(r.message);
                if (r.success) { closeEditModal(); loadData(currentPage); }
            } else {
                params.append('username', username); params.append('password', password);
                params.append('name', name); params.append('age', age || '0');
                params.append('gender', gender); params.append('phone', phone);
                params.append('email', email); params.append('position', position);
                params.append('salary', salary || '0'); params.append('status', status || '在职');
                if (branchId) params.append('branchId', branchId);
                const resp = await fetch('/api/employees', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                alert(r.message);
                if (r.success) { closeEditModal(); loadData(1); }
            }
        }

        async function deleteItem(id, name) {
            if (!confirm('确定删除「' + name + '」(ID:' + id + ')？')) return;
            await fetch('/api/employees/' + id, { method: 'DELETE' });
            loadData(currentPage);
        }

        document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
        loadData(1);
    </script>
</body>
</html>
