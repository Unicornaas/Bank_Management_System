<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户管理</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --primary: #1e3a5f; --primary-light: #2d5a87;
            --accent: #c9a84c;
            --bg: #f1f5f9; --card: #ffffff;
            --text: #1a202c; --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --radius: 14px; --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Microsoft YaHei', -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px 28px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
        .stat-card .icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .icon.blue { background: #eff6ff; } .icon.green { background: #ecfdf5; } .icon.amber { background: #fffbeb; } .icon.purple { background: #f5f3ff; }
        .stat-card .info .value { font-size: 22px; font-weight: 700; line-height: 1.2; }
        .stat-card .info .label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .search-bar { background: var(--card); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; box-shadow: var(--shadow); }
        .search-bar .field { display: flex; flex-direction: column; gap: 4px; }
        .search-bar label { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .search-bar input, .search-bar select { height: 38px; border: 1.5px solid var(--border); border-radius: 8px; padding: 0 12px; font-size: 13px; background: #f8fafc; outline: none; width: 140px; }
        .search-bar input:focus, .search-bar select:focus { border-color: var(--primary-light); background: #fff; }
        .btn-search { background: var(--primary); color: #fff; border: none; height: 38px; padding: 0 22px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-reset { background: #fff; color: var(--text-secondary); border: 1.5px solid var(--border); height: 38px; padding: 0 18px; border-radius: 8px; cursor: pointer; }
        .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f8fafc; }
        th { padding: 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        tbody tr:hover { background: #f8fafc; }
        .money-positive { color: #059669; font-weight: 600; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-normal { background: #ecfdf5; color: #059669; }
        .pagination-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: #f8fafc;
        }
        .pagination-wrap button {
            min-width: 34px;
            height: 34px;
            border: 1.5px solid var(--border);
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            transition: var(--transition);
        }
        .pagination-wrap button:hover:not(:disabled) {
            border-color: var(--primary-light);
            background: #eff6ff;
            color: var(--primary);
        }
        .pagination-wrap button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .pagination-wrap button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination-wrap span {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 0 4px;
        }
        .page-info {
            margin-left: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h2>💳 账户列表 <span style="font-size:13px;color:var(--text-secondary);font-weight:400;" id="totalCount"></span></h2>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><div class="icon blue">👥</div><div class="info"><div class="value" id="statTotal">--</div><div class="label">总账户数</div></div></div>
        <div class="stat-card"><div class="icon green">💰</div><div class="info"><div class="value" id="statMoney">--</div><div class="label">总存款额 (元)</div></div></div>
        <div class="stat-card"><div class="icon amber">📊</div><div class="info"><div class="value" id="statAvg">--</div><div class="label">人均余额 (元)</div></div></div>
        <div class="stat-card"><div class="icon purple">🏆</div><div class="info"><div class="value" id="statMax">--</div><div class="label">最高余额 (元)</div></div></div>
    </div>

    <div class="search-bar">
        <div class="field"><label>账号</label><input type="text" id="sUsername" placeholder="模糊搜索"></div>
        <div class="field"><label>姓名</label><input type="text" id="sName" placeholder="模糊搜索"></div>
        <div class="field"><label>余额≥</label><input type="number" id="sMoney" placeholder="0"></div>
        <button class="btn-search" onclick="doSearch()">🔍 搜索</button>
        <button class="btn-reset" onclick="resetSearch()">↻ 重置</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr><th>编号</th><th>账号</th><th>姓名</th><th>性别</th><th>年龄</th><th>手机号</th><th>身份证</th><th>余额 (元)</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="pagination-wrap" id="pagination"></div>
    </div>

    <script>
        let currentPage = 1, pageSize = 10, totalPages = 1;

        async function loadStats() {
            try {
                const resp = await fetch('/api/users');
                const r = await resp.json();
                const users = r.data || [];
                document.getElementById('statTotal').textContent = users.length;
                const total = users.reduce((s,u) => s + (u.money||0), 0);
                document.getElementById('statMoney').textContent = total.toLocaleString('zh-CN',{minimumFractionDigits:2});
                document.getElementById('statAvg').textContent = (users.length>0?(total/users.length):0).toLocaleString('zh-CN',{minimumFractionDigits:2});
                document.getElementById('statMax').textContent = (users.length>0?Math.max(...users.map(u=>u.money||0)):0).toLocaleString('zh-CN',{minimumFractionDigits:2});
            } catch(e) {}
        }

        async function loadData(page = 1) {
            currentPage = page;
            try {
                const resp = await fetch('/api/users/page?page=' + page + '&size=' + pageSize);
                const r = await resp.json();
                if (r.success) {
                    renderData(r.data || []);
                    totalPages = r.totalPages;
                    document.getElementById('totalCount').textContent = '· 共 ' + r.total + ' 个账户';
                    renderPagination();
                    loadStats();
                }
            } catch(e) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;">加载失败</td></tr>'; }
        }

        function renderPagination() {
            const pg = document.getElementById('pagination');
            if (totalPages <= 1) { pg.innerHTML = ''; return; }
            let html = '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="loadData(' + (currentPage - 1) + ')">◀</button>';
            const s = Math.max(1, currentPage - 2), e = Math.min(totalPages, currentPage + 2);
            if (s > 1) { html += '<button onclick="loadData(1)">1</button>'; if (s > 2) html += '<span>…</span>'; }
            for (let i = s; i <= e; i++) html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="loadData(' + i + ')">' + i + '</button>';
            if (e < totalPages) { if (e < totalPages - 1) html += '<span>…</span>'; html += '<button onclick="loadData(' + totalPages + ')">' + totalPages + '</button>'; }
            html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="loadData(' + (currentPage + 1) + ')">▶</button>';
            html += '<span class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
            pg.innerHTML = html;
        }

        function renderData(data) {
            const tbody = document.getElementById('tableBody');
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:48px;">暂无数据</td></tr>'; return; }
            tbody.innerHTML = data.map(u => `<tr>
                <td>${u.id}</td><td>${u.username||'-'}</td><td><strong>${u.name||'-'}</strong></td>
                <td>${u.gender||'-'}</td><td>${u.age||'-'}</td><td>${u.phone||'-'}</td>
                <td style="font-size:12px;">${u.card||'-'}</td>
                <td class="money-positive">￥${(u.money||0).toLocaleString('zh-CN',{minimumFractionDigits:2})}</td>
            </tr>`).join('');
        }

        async function doSearch() {
            const params = new URLSearchParams();
            const name = document.getElementById('sName').value.trim();
            const username = document.getElementById('sUsername').value.trim();
            const money = document.getElementById('sMoney').value;
            if (name) params.append('name', name);
            if (username) params.append('username', username);
            if (money) params.append('money', money);
            try {
                const resp = await fetch('/api/users/search', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
                const r = await resp.json();
                document.getElementById('totalCount').textContent = '· 搜索结果：' + (r.data||[]).length + ' 个';
                renderData(r.data || []);
                document.getElementById('pagination').innerHTML = '<span class="page-info" style="cursor:pointer;color:var(--primary-light);" onclick="resetSearch()">↻ 返回分页列表</span>';
            } catch(e) { alert('搜索失败'); }
        }

        function resetSearch() {
            ['sUsername','sName','sMoney'].forEach(id => document.getElementById(id).value = '');
            loadData(1);
        }

        loadData(1);
    </script>
</body>
</html>
